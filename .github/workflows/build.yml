name: Build TG UNLOCK (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build.yml'
      - 'patch_branding.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout customization repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch upstream source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/Flowseal/tg-ws-proxy.git upstream
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось скачать исходный проект Flowseal/tg-ws-proxy.' }

      - name: Apply TG UNLOCK branding and UI improvements
        shell: pwsh
        run: |
          if (-not (Test-Path 'patch_branding.py')) { throw 'В репозитории отсутствует patch_branding.py.' }
          python -m py_compile patch_branding.py
          if ($LASTEXITCODE -ne 0) { throw 'Ошибка синтаксиса patch_branding.py.' }
          python patch_branding.py
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось применить изменения брендинга и интерфейса.' }

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./upstream
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось установить зависимости проекта.' }
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось установить PyInstaller.' }

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean upstream/packaging/windows.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller завершился с ошибкой.' }

          # Имя EXE в upstream .spec может остаться TgWsProxy.exe.
          # Берём любой созданный EXE и публикуем его под именем TG_UNLOCK.exe.
          $exe = Get-ChildItem -Path 'dist' -Filter '*.exe' -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/]artifact[\\/]' } |
            Select-Object -First 1
          if (-not $exe) { throw 'После сборки не найден EXE-файл в папке dist.' }

          New-Item -ItemType Directory -Force -Path 'artifact' | Out-Null
          Copy-Item $exe.FullName 'artifact/TG_UNLOCK.exe' -Force

          if (Test-Path 'upstream/LICENSE') {
            Copy-Item 'upstream/LICENSE' 'artifact/UPSTREAM-LICENSE.txt' -Force
          }

          @(
            'TG UNLOCK',
            'Автор приложения: Artem_Sukhinin',
            '',
            'Customized build of Flowseal/tg-ws-proxy.',
            'Original copyright and MIT license notices are retained.',
            'The upstream proxy implementation is not claimed as original work.'
          ) | Set-Content -Encoding utf8 'artifact/ABOUT-TG-UNLOCK.txt'

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-UNLOCK-windows-x64
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
