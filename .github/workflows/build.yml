name: Build TG UNLOCK (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout TG UNLOCK build wrapper
        uses: actions/checkout@v4

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: Flowseal/tg-ws-proxy
          ref: main
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path upstream/pyproject.toml) {
            python -m pip install -e upstream
          } else {
            Write-Error 'Upstream pyproject.toml not found; upstream build layout may have changed.'
          }

      - name: Build upstream Windows executable
        shell: pwsh
        working-directory: upstream
        run: |
          if (Test-Path packaging/windows.spec) {
            python -m pip install pyinstaller
            python -m PyInstaller --noconfirm packaging/windows.spec
          } else {
            Write-Error 'packaging/windows.spec not found; check upstream build instructions.'
          }

      - name: Prepare artifact and preserve upstream license
        shell: pwsh
        run: |
          $exe = Get-ChildItem upstream/dist -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            throw 'No EXE found in upstream/dist. Review the upstream build output.'
          }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe.FullName 'artifact/TG_UNLOCK.exe'
          if (Test-Path upstream/LICENSE) {
            Copy-Item upstream/LICENSE 'artifact/UPSTREAM-LICENSE.txt'
          } else {
            throw 'Upstream LICENSE file missing; refusing to package without it.'
          }
          Set-Content -Path 'artifact/BUILD-INFO.txt' -Value 'TG UNLOCK unofficial build wrapper by Artem_Sukhinin. Upstream: Flowseal/tg-ws-proxy. Executable filename is customized; internal application branding may remain unchanged.' -Encoding UTF8

      - name: Upload TG UNLOCK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG_UNLOCK-windows-x64
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
